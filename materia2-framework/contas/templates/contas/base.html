{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}DataAI{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'contas/dataai-marca-escuro.svg' %}">
  <link rel="stylesheet" href="{% static 'contas/dataai.css' %}">
</head>
<body>
  {% block corpo %}
  <header class="topo">
    <a class="marca marca-topo" href="{% url 'contas:home' %}">
      <img src="{% static 'contas/dataai-marca-escuro.svg' %}" alt="">
      <span>DataAI</span>
    </a>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'contas:logout' %}">
      {% csrf_token %}
      <span class="usuario corpo-p suave">{{ user }}</span>
      <button type="submit" class="botao botao-secundario">Sair</button>
    </form>
    {% endif %}
  </header>
  <main class="conteudo">{% block content %}{% endblock %}</main>
  {% endblock %}
</body>
</html>
